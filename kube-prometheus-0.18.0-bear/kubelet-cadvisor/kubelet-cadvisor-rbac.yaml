apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelet-cadvisor
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubelet-cadvisor
rules:
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelet-cadvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubelet-cadvisor
subjects:
- kind: ServiceAccount
  name: kubelet-cadvisor
  namespace: monitoring
---
# 实验环境：放开 kubelet-cadvisor ServiceAccount 的 RBAC 权限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubelet-cadvisor-open
rules:
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelet-cadvisor-open
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubelet-cadvisor-open
subjects:
- kind: ServiceAccount
  name: kubelet-cadvisor
  namespace: monitoring
