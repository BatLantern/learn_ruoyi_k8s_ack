apiVersion: v1
kind: Service
metadata:
  name: node-exporter-2
  namespace: monitoring
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: kube-prometheus
  ports:
  - name: http
    port: 9100
    targetPort: 9100
    protocol: TCP
    nodePort: 30268
