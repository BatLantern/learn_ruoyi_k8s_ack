targets:
  dingtalk:
    url: "https://oapi.dingtalk.com/robot/send?access_token=78b7de57bbc02bf49366097215cb6279a23e582b13d0115d2ccd15cab79332e6"
    secret: "SECb806dd3eb080937bb613f7c68840b313f5b48b9b5e041d38eb892f7727ff5cd4"
default_message:
  title: >-
    【监控告警】
    {{ if eq .Status "firing" }}告警触发{{ else }}告警恢复{{ end }}
  text: |
    ## 【监控告警】

    **告警状态：**
    {{ if eq .Status "firing" }}🔴 正在告警{{ else }}🟢 已恢复{{ end }}

    **告警名称：**
    {{ index .GroupLabels "alertname" }}

    {{ if gt (len .Alerts.Firing) 0 }}
    ### 当前告警

    {{ range .Alerts.Firing }}
    **告警摘要：** {{ .Annotations.summary }}

    **告警详情：** {{ .Annotations.description }}

    **告警级别：**
    {{ if eq .Labels.severity "critical" }}严重
    {{ else if eq .Labels.severity "warning" }}警告
    {{ else if eq .Labels.severity "info" }}提示
    {{ else }}{{ .Labels.severity }}
    {{ end }}

    **实例：** {{ .Labels.instance }}

    **开始时间：** {{ .StartsAt }}

    ---
    {{ end }}
    {{ end }}

    {{ if gt (len .Alerts.Resolved) 0 }}
    ### 已恢复告警

    {{ range .Alerts.Resolved }}
    **告警摘要：** {{ .Annotations.summary }}

    **恢复时间：** {{ .EndsAt }}

    ---
    {{ end }}
    {{ end }}
