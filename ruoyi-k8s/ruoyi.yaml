apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-gateway
  template:
    metadata:
      labels:
        app: ruoyi-gateway
    spec:
      tolerations:
        - key: "node.kubernetes.io/network-unavailable"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: ruoyi-gateway
          image: crpi-wi9tjhesle0kd7vo.cn-hangzhou.personal.cr.aliyuncs.com/yanwu/ruoyi-gateway:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR
              value: "120.27.247.65:8848"

            - name: SPRING_CLOUD_NACOS_CONFIG_SERVERADDR
              value: "120.27.247.65:8848"

---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
  namespace: default
spec:
  selector:
    app: ruoyi-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
