# ============================================================
# ruoyi-auth
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-auth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-auth
  template:
    metadata:
      labels:
        app: ruoyi-auth
    spec:
      nodeSelector:
        role: nacos

      tolerations:
        - key: "node.kubernetes.io/network-unavailable"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: ruoyi-auth
          image: crpi-wi9tjhesle0kd7vo.cn-hangzhou.personal.cr.aliyuncs.com/yanwu/ruoyi-auth:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVERADDR
              value: "120.27.247.65:8848"
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVERADDR
              value: "120.27.247.65:8848"

---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-auth
  namespace: default
spec:
  selector:
    app: ruoyi-auth
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP


