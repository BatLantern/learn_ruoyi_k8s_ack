apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-job
  template:
    metadata:
      labels:
        app: ruoyi-job
    spec:
      containers:
        - name: ruoyi-job
          image: crpi-wi9tjhesle0kd7vo-vpc.cn-hangzhou.personal.cr.aliyuncs.com/yanwu/ruoyi-job:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9203
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: "172.26.41.3:8848"
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: "172.26.41.3:8848"

---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-job
spec:
  selector:
    app: ruoyi-job
  ports:
    - port: 9203
      targetPort: 9203
  type: ClusterIP
