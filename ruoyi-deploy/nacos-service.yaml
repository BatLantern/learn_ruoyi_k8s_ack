apiVersion: v1
kind: Service
metadata:
  name: nacos-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: nacos

  ports:
    # Nacos HTTP
    - name: nacos-http
      port: 8848
      targetPort: 8848
      protocol: TCP
      nodePort: 30826

    # Nacos 2.x 客户端 gRPC
    - name: nacos-client-grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
      nodePort: 30948

    # Nacos 2.x Raft gRPC
    - name: nacos-raft-grpc
      port: 9849
      targetPort: 9849
      protocol: TCP
      nodePort: 30949
