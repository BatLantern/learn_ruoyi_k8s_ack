apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ruoyi-job-monitor
  namespace: monitoring
  labels:
    release: prometheus
    prometheus: k8s
spec:
  selector:
    matchLabels:
      app: ruoyi-job
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: jmx-metrics
      path: /metrics
      interval: 15s
